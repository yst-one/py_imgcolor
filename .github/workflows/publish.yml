name: build_whl_update

on:
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  my_job:
    name: build_whl_update
    runs-on: ubuntu-22.04

    steps:
      - name: 签出代码
        uses: actions/checkout@v6

      - name: 设置 UV 环境
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 编译生成 WHL 包
        run: uv build

      - name: 保存编译产物
        uses: actions/upload-artifact@v6
        with:
          name: imgcolor-whl-packages
          path: dist/

      - name: 检查 PyPI Token 已配置
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::仓库未配置 Secret PYPI_API_TOKEN，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "PYPI_API_TOKEN 已配置"

      - name: 发布到 PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --token "$PYPI_TOKEN"
