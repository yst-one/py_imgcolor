name: build_whl_update

on:
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  my_job:
    name: build_whl_update
    runs-on: ubuntu-22.04

    steps:
      - name: 签出代码
        uses: actions/checkout@v6

      - name: 设置 UV 环境
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 编译生成 WHL 包
        run: uv build

      - name: 保存编译产物
        uses: actions/upload-artifact@v6
        with:
          name: imgcolor-whl-packages
          path: dist/

      - name: 检查 PyPI Token 已配置
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::仓库未配置 Secret PYPI_API_TOKEN，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "PYPI_API_TOKEN 已配置"

      - name: 诊断 PyPI Token 格式（脱敏，不打印明文）
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          t = os.environ["PYPI_TOKEN"]
          print("长度:", len(t))
          print("前缀是否为 pypi- :", t.startswith("pypi-"))
          print("首尾是否有空白 :", t != t.strip())
          print("是否含引号     :", ("'" in t) or ('"' in t))
          print("是否含换行     :", ("\n" in t) or ("\r" in t))
          print("开头 8 字符    :", t[:8])
          print("结尾 4 字符    :", t[-4:])
          if not t.startswith("pypi-"):
              print("::error::TOKEN 不是 pypi- 开头！PyPI API Token 必须以 pypi- 开头，请检查是否填成了 GitHub PAT 或账号密码")
          if t != t.strip() or ('"' in t) or ("'" in t):
              print("::error::TOKEN 含多余引号或空白，请在 GitHub Secret 里重新粘贴纯 token（不要带引号）")
          PY

      - name: 发布到 PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --token "$PYPI_TOKEN"
